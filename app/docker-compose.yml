version: "3.8"

services:
  web:
    image: ghcr.io/daniifrim/apme-implicare-web:latest
    networks:
      - public_net
      - internal
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - FILLOUT_API_KEY=${FILLOUT_API_KEY}
      - FILLOUT_WEBHOOK_SECRET=${FILLOUT_WEBHOOK_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APP_URL=${APP_URL}
      - APPS_SCRIPT_WEBHOOK_URL=${APPS_SCRIPT_WEBHOOK_URL}
      - APPS_SCRIPT_API_KEY=${APPS_SCRIPT_API_KEY}
      - USE_APPS_SCRIPT_SENDER=${USE_APPS_SCRIPT_SENDER:-false}
      - ALERT_EMAIL=${ALERT_EMAIL}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.apme-implicare.rule=Host(`${APP_HOST}`)"
        - "traefik.http.routers.apme-implicare.entrypoints=websecure"
        - "traefik.http.routers.apme-implicare.tls.certresolver=leresolver"
        - "traefik.http.services.apme-implicare.loadbalancer.server.port=3000"
        - "traefik.http.services.apme-implicare.loadbalancer.healthcheck.path=/api/health"
        - "traefik.http.services.apme-implicare.loadbalancer.healthcheck.interval=10s"
        - "traefik.http.services.apme-implicare.loadbalancer.healthcheck.timeout=5s"

  postgres:
    image: postgres:16-alpine
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3

  redis:
    image: redis:7-alpine
    networks:
      - internal
    volumes:
      - redis_data:/data
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3

  # Scheduled health monitor — calls alerting endpoint every 5 minutes
  health-monitor:
    image: alpine/curl:latest
    networks:
      - internal
    environment:
      - MONITOR_URL=http://web:3000/api/health/alerting
      - MONITOR_INTERVAL=300
    command: >
      sh -c '
        echo "[HealthMonitor] Starting scheduled health checks every $${MONITOR_INTERVAL}s"
        while true; do
          echo "[HealthMonitor] $$(date -Iseconds) — Checking health..."
          curl -sf "$${MONITOR_URL}" -o /dev/null && echo "[HealthMonitor] OK" || echo "[HealthMonitor] ALERT endpoint returned non-2xx"
          sleep "$${MONITOR_INTERVAL}"
        done
      '
    deploy:
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 3
      replicas: 1

volumes:
  postgres_data:
  redis_data:

networks:
  public_net:
    external: true
  internal:
    driver: overlay
    attachable: true
